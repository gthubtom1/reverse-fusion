<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>标签收纳盒</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ee;color:#282b28;font:16px/1.5 system-ui,sans-serif}main{max-width:860px;margin:48px auto;padding:28px;background:white;border:1px solid #d7d8d2;border-radius:8px}h1{margin:0 0 4px;font-size:28px}p{color:#656961}form,.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}label{display:grid;gap:5px;flex:1}input,select,button{font:inherit;padding:9px 12px;border:1px solid #babeb4;border-radius:4px}button{cursor:pointer;background:#365b45;color:white;align-self:end}button.secondary{background:white;color:#365b45}#error{min-height:24px;color:#a33124}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e5e7df;padding:12px 8px}th{font-weight:600;color:#565f51}#empty{padding:24px;text-align:center}footer{display:flex;justify-content:space-between;margin-top:20px}.remove{padding:4px 9px;background:white;color:#8b3b32}@media(max-width:600px){main{margin:12px;padding:18px}label{min-width:120px}}
</style>
<main>
<h1>标签收纳盒</h1><p>把零散物品放进分类，数量与清单只保存在当前浏览器。</p>
<form id="add"><label>名称<input id="name" autocomplete="off"></label><label>分类<input id="tag" autocomplete="off"></label><label>数量<input id="quantity" type="number" value="1"></label><button>添加条目</button></form>
<div id="error" role="alert"></div>
<div class="toolbar"><label>搜索名称或分类<input id="query" placeholder="输入关键词"></label><label>排序<select id="order"><option value="newest">最近添加</option><option value="name">按名称</option></select></label></div>
<table><thead><tr><th>名称</th><th>分类</th><th>数量</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table>
<div id="empty">还没有条目，先添加一个吧。</div>
<footer><span id="summary"></span><button type="button" id="clear" class="secondary">清空全部</button></footer>
</main><script type="module" src="./page.mjs"></script>
</html>
